<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primaryGlow)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Cyber grid accents -->
  <path d="M64 256h384M256 64v384" stroke="#334155" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 6" />

  <!-- Central Forge / Mailbox Symbol -->
  <g transform="translate(106, 126)" filter="url(#glow)">
    <!-- Envelope Base Shield -->
    <rect x="0" y="40" width="300" height="200" rx="28" fill="#18181b" stroke="url(#primaryGlow)" stroke-width="7" />
    
    <!-- Envelope Flap -->
    <path d="M10 50 L150 160 L290 50" fill="none" stroke="url(#primaryGlow)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Anvil / Forge Horn Accent -->
    <path d="M90 190 L150 140 L210 190" fill="none" stroke="url(#accentGlow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Forge Spark / Dot Core -->
    <circle cx="150" cy="140" r="14" fill="#38bdf8" />
    <circle cx="150" cy="140" r="24" fill="#38bdf8" fill-opacity="0.2" />
  </g>
</svg>
